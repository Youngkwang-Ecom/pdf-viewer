<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 뷰어</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        iframe {
            width: 80%;
            height: 600px;
            border: none;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>2025 상반기 제품 카탈로그</h2>

    <!-- PDF 뷰어 (GitHub Pages에서 로드) -->
    <iframe src="https://your-username.github.io/pdf-viewer/2025_catalog.pdf" width="80%" height="600px"></iframe>

    <!-- 다운로드 버튼 -->
    <br>
    <a href="https://your-username.github.io/pdf-viewer/2025_catalog.pdf" download class="download-btn">
        PDF 다운로드
    </a>

</body>
</html>
